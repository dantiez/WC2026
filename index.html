<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup 2026 · Jersey Customizer</title>
    <meta name="description" content="Tùy biến và đặt áo đấu World Cup 2026 — chọn đội tuyển, tên & số in cá nhân hóa." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='55' text-anchor='middle' dominant-baseline='middle' font-size='80'>🏆</text></svg>" />
    <script>
      try {
        var t = localStorage.getItem('app.theme') || 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
        var l = localStorage.getItem('app.language') || 'vn';
        document.documentElement.setAttribute('lang', l === 'vn' ? 'vi' : 'en');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
